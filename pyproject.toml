[project]
name = "llm-plug"
version = "1.3.5"
description = "LLM API 转换器 — 支持 OpenAI Chat Completions、OpenAI Response 和 Anthropic 格式互转，带负载均衡与故障转移"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httptools>=0.8.0",
    "httpx[socks]>=0.28.1",
    "pydantic>=2.13.5",
    "python-socks[asyncio]>=3.1.1",
    "uvicorn>=0.53.0",
    "loguru>=0.7.3",
    "uvloop>=0.21.0; sys_platform != 'win32'",
    "tzdata>=2026.4; sys_platform == 'win32'",
    "brotli>=1.2.0",
    "zstandard>=0.25.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
    "pyright[nodejs]>=1.1.414",
]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.24",
]

[[tool.uv.index]]
url = "https://mirrors.cloud.tencent.com/pypi/simple/"
default = true

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # Pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "I",   # isort
]
ignore = [
    "SIM105", # try/except/pass → contextlib.suppress：纯写法，ruff 无安全自动修复
    "SIM115", # open() → with open()：纯写法，ruff 无安全自动修复
    "SIM117", # 嵌套 with → 合并：纯写法，ruff 无安全自动修复
    "UP040",  # TypeAlias → type：纯风格，ruff 无安全自动修复
    "UP007",  # Optional[X] → X | Y：纯风格，ruff 无安全自动修复
    "UP042",  # str+Enum → StrEnum：--unsafe-fixes 才修，会改语义
]
