<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
    <title data-i18n="login.title">管理员登录</title>
    <script src="/admin/static/tailwind.min.js?v=__STATIC_ASSET_VERSION__"></script>
    <script src="/admin/static/js/tailwind-config.js?v=__STATIC_ASSET_VERSION__"></script>
    <link rel="stylesheet" href="/admin/static/css/admin.css?v=__STATIC_ASSET_VERSION__">
    <script src="/admin/static/js/i18n.js?v=__STATIC_ASSET_VERSION__"></script>
    <script src="/admin/static/js/i18n-zh.js?v=__STATIC_ASSET_VERSION__"></script>
    <script src="/admin/static/js/i18n-en.js?v=__STATIC_ASSET_VERSION__"></script>
</head>
<body class="min-h-screen bg-surface-50 flex items-center justify-center px-4">
    <div class="w-full max-w-sm animate-fade-in">
        <!-- Logo/Brand -->
        <div class="text-center mb-8">
            <div class="w-12 h-12 rounded-xl bg-brand-500 flex items-center justify-center text-white text-lg font-semibold mx-auto mb-4" aria-hidden="true">L</div>
            <h1 class="text-2xl font-semibold text-ink-900" data-i18n="login.title">管理员登录</h1>
            <p class="text-sm text-ink-500 mt-2" data-i18n="login.subtitle">仅用于后台管理，不影响 LLM API 请求鉴权。</p>
        </div>

        <div class="card p-6">
            <div id="setupHint" class="hidden mb-4 text-sm rounded-lg bg-brand-50 border border-brand-200 p-3 text-brand-800" data-i18n="login.setupHint">
                首次使用请先设置管理员密码。
            </div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label id="passwordLabel" class="block text-sm font-medium text-ink-800 mb-1.5" data-i18n="login.passwordLabel">管理员密码</label>
                    <input id="password" type="password" class="w-full px-3 py-2.5 text-sm" autocomplete="current-password">
                </div>
                <button id="submitBtn" type="submit" class="btn-primary w-full px-4 py-2.5 text-sm font-medium" data-i18n="login.submit">登录</button>
            </form>

            <details class="mt-5">
              <summary class="text-sm text-ink-500 cursor-pointer hover:text-ink-700 transition" data-i18n="login.forgotPassword">忘记密码？</summary>
              <div class="mt-3 text-sm text-ink-600 bg-surface-50 rounded-lg p-4 border border-surface-200">
                <p class="font-medium text-ink-800 mb-2" data-i18n="login.resetTitle">管理员强制重置密码：</p>
                <ol class="list-decimal list-inside space-y-1.5 text-ink-600">
                  <li data-i18n="login.resetStep1">删除 <code class="text-xs bg-surface-100 px-1.5 py-0.5 rounded font-mono">data/admin_auth.json</code> 文件</li>
                  <li data-i18n="login.resetStep2">重启服务</li>
                  <li data-i18n="login.resetStep3">重新访问此页面设置新密码</li>
                </ol>
                <p class="mt-3 text-xs text-ink-400" data-i18n="login.resetNote">注意：此操作会清除所有已登录的会话。</p>
              </div>
            </details>

            <p id="message" class="mt-4 text-sm text-brand-600 font-medium"></p>
        </div>

        <div class="text-center mt-6">
            <button type="button" onclick="I18n.toggle()" class="text-xs text-ink-400 hover:text-ink-600 font-medium transition" data-i18n-title="common.langLabel" data-i18n-aria="common.langLabel" title="切换语言" aria-label="切换语言">
                <span data-i18n="common.langLabel">中/EN</span>
            </button>
        </div>
    </div>

    <script>
    let isSetupMode = false;

    async function loadStatus() {
        const resp = await fetch('/admin/auth/status');
        const data = await resp.json();
        const setupHint = document.getElementById('setupHint');
        const password = document.getElementById('password');
        if (!data.configured) {
            isSetupMode = true;
            setupHint.classList.remove('hidden');
            document.getElementById('passwordLabel').textContent = I18n.t('login.setPasswordLabel');
            document.getElementById('submitBtn').textContent = I18n.t('login.setupSubmit');
            password.autocomplete = 'new-password';
        }
    }

    document.addEventListener('i18n:langchange', () => {
        if (isSetupMode) {
            document.getElementById('passwordLabel').textContent = I18n.t('login.setPasswordLabel');
            document.getElementById('submitBtn').textContent = I18n.t('login.setupSubmit');
        }
    });

    function extractErrorMessage(detail) {
        if (typeof detail === 'string') return detail;
        if (Array.isArray(detail)) return detail.map(e => (typeof e === 'object' && e !== null ? (e.msg || JSON.stringify(e)) : String(e))).join('; ');
        if (detail && typeof detail === 'object') return detail.message || JSON.stringify(detail);
        return '';
    }

    document.getElementById('loginForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const message = document.getElementById('message');
        message.textContent = '';
        const password = document.getElementById('password').value;
        try {
            const resp = await fetch('/admin/auth/setup-login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({password}),
            });
            if (!resp.ok) {
                const body = await resp.json().catch(() => null);
                throw new Error(extractErrorMessage(body?.detail) || I18n.t('login.loginFailed'));
            }
            window.location.href = '/admin/';
        } catch (err) {
            message.textContent = err.message || String(err);
        }
    });

    loadStatus();
    </script>
</body>
</html>
