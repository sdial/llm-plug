<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="streamTest.title">流式响应测试工具</title>
    <script src="/admin/static/tailwind.min.js?v=__STATIC_ASSET_VERSION__"></script>
    <script src="/admin/static/js/tailwind-config.js?v=__STATIC_ASSET_VERSION__"></script>
    <link rel="stylesheet" href="/admin/static/css/admin.css?v=__STATIC_ASSET_VERSION__">
    <script src="/admin/static/js/i18n.js?v=__STATIC_ASSET_VERSION__"></script>
    <script src="/admin/static/js/i18n-zh.js?v=__STATIC_ASSET_VERSION__"></script>
    <script src="/admin/static/js/i18n-en.js?v=__STATIC_ASSET_VERSION__"></script>
    <style>
        /* Page-specific styles only */
        .output-terminal {
            background: #1e1e1e;
            color: #d4d4d4;
            font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
            border-radius: 8px;
            padding: 16px;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
        }
        .output-terminal::-webkit-scrollbar {
            width: 8px;
        }
        .output-terminal::-webkit-scrollbar-track {
            background: #2d2d2d;
            border-radius: 4px;
        }
        .output-terminal::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 4px;
        }
        .stat-card-mini {
            background: #ffffff;
            border: 1px solid #e8e6e3;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }
        .stat-card-mini .label {
            color: #6b6b6b;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 4px;
        }
        .stat-card-mini .value {
            color: #1a1a1a;
            font-size: 18px;
            font-weight: 600;
        }
        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #6b6b6b;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #9ca3af;
        }
        .status-dot.streaming {
            background: #059669;
            animation: pulse-dot 1.5s ease-in-out infinite;
        }
        .status-dot.done {
            background: #2563eb;
        }
        .status-dot.error {
            background: #dc2626;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.9); }
        }
    </style>
</head>
<body class="min-h-screen">
    <div class="max-w-4xl mx-auto px-4 py-6">
        <!-- Header -->
        <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-3">
                <a href="/admin" class="text-ink-500 hover:text-ink-900 transition p-1 rounded-lg hover:bg-surface-100" data-i18n-aria="streamTest.backToAdmin" aria-label="返回管理页面">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                </a>
                <h1 class="text-lg font-semibold text-ink-900" data-i18n="streamTest.title">流式响应测试工具</h1>
            </div>
            <button type="button" onclick="I18n.toggle()" class="btn-secondary px-2.5 py-1.5 text-xs font-medium" id="langBtn" data-i18n="common.langLabel" data-i18n-aria="common.langLabel">
                中/EN
            </button>
        </div>

        <!-- Config Form -->
        <div class="card p-5 mb-5">
            <h2 class="text-sm font-semibold text-ink-900 mb-4" data-i18n="streamTest.config">配置</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                <div>
                    <label for="apiUrl" class="block text-sm font-medium text-ink-800 mb-1.5" data-i18n="streamTest.apiUrl">API 端点</label>
                    <input type="text" id="apiUrl" value="http://localhost:55555/v1/chat/completions" class="w-full px-3 py-2.5 text-sm font-mono">
                </div>
                <div>
                    <label for="apiKey" class="block text-sm font-medium text-ink-800 mb-1.5" data-i18n="streamTest.apiKey">API Key</label>
                    <input type="text" id="apiKey" value="test-key" class="w-full px-3 py-2.5 text-sm">
                </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                <div>
                    <label for="model" class="block text-sm font-medium text-ink-800 mb-1.5" data-i18n="streamTest.modelName">模型名称</label>
                    <input type="text" id="model" value="google/gemma-4-31b-it" class="w-full px-3 py-2.5 text-sm">
                </div>
                <div>
                    <label for="prompt" class="block text-sm font-medium text-ink-800 mb-1.5" data-i18n="streamTest.prompt">提示词</label>
                    <textarea id="prompt" rows="3" class="w-full px-3 py-2.5 text-sm resize-y" data-i18n-placeholder="streamTest.promptPlaceholder" placeholder="输入提示词..."></textarea>
                </div>
            </div>
            <div class="flex gap-3">
                <button type="button" class="btn-primary px-5 py-2.5 text-sm font-medium flex items-center gap-2" id="startBtn" onclick="startStream()">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    <span data-i18n="streamTest.start">开始流式请求</span>
                </button>
                <button type="button" class="btn-secondary px-5 py-2.5 text-sm font-medium hidden" id="stopBtn" onclick="stopStream()">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" ry="2"/></svg>
                    <span data-i18n="streamTest.stop">停止</span>
                </button>
            </div>
        </div>

        <!-- Output -->
        <div class="card p-5">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-sm font-semibold text-ink-900" data-i18n="streamTest.realtimeOutput">实时输出</h2>
                <div class="status-indicator">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText" class="text-xs text-ink-500">就绪</span>
                </div>
            </div>
            <div class="output-terminal" id="output" aria-live="polite"></div>

            <!-- Stats -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-4">
                <div class="stat-card-mini">
                    <div class="label" data-i18n="streamTest.chunks">接收到的 Chunks</div>
                    <div class="value" id="chunkCount">0</div>
                </div>
                <div class="stat-card-mini">
                    <div class="label" data-i18n="streamTest.totalChars">总字符数</div>
                    <div class="value" id="charCount">0</div>
                </div>
                <div class="stat-card-mini">
                    <div class="label" data-i18n="streamTest.duration">耗时 (秒)</div>
                    <div class="value" id="duration">0</div>
                </div>
                <div class="stat-card-mini">
                    <div class="label" data-i18n="streamTest.speed">速率 (tok/s)</div>
                    <div class="value" id="speed">0</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let abortController = null;
        let startTime = null;
        let chunkCount = 0;
        let charCount = 0;
        let outputBytes = 0;
        let durationInterval = null;
        let currentStatus = '';

        const $ = (id) => document.getElementById(id);

        function initPrompt() {
            $('prompt').value = I18n.t('streamTest.promptDefault');
            currentStatus = 'ready';
            applyStatusText('ready');
        }

        function applyStatusText(status) {
            const keys = {
                ready: 'streamTest.statusReady',
                streaming: 'streamTest.statusStreaming',
                done: 'streamTest.statusDone',
                error: 'streamTest.statusError',
                '': 'streamTest.statusStopped'
            };
            $('statusText').textContent = I18n.t(keys[status] ?? 'streamTest.statusReady');
        }

        function updateStatus(status) {
            currentStatus = status;
            const dot = $('statusDot');
            dot.className = 'status-dot ' + status;
            applyStatusText(status);
        }

        async function startStream() {
            const apiUrl = $('apiUrl').value.trim();
            const apiKey = $('apiKey').value.trim();
            const model = $('model').value.trim();
            const prompt = $('prompt').value.trim();

            if (!prompt) {
                alert(I18n.t('streamTest.inputPromptRequired'));
                return;
            }

            chunkCount = 0;
            charCount = 0;
            outputBytes = 0;
            $('output').textContent = '';
            $('chunkCount').textContent = '0';
            $('charCount').textContent = '0';
            $('duration').textContent = '0';
            $('speed').textContent = '0';
            updateStatus('streaming');

            $('startBtn').classList.add('hidden');
            $('stopBtn').classList.remove('hidden');

            abortController = new AbortController();
            startTime = Date.now();

            durationInterval = setInterval(() => {
                const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
                $('duration').textContent = elapsed;
                if (parseFloat(elapsed) > 0) {
                    // 估算 token 数：按 UTF-8 字节长度 / 2.4（中英文混合经验值）
                    const estTokens = outputBytes / 2.4;
                    $('speed').textContent = (estTokens / parseFloat(elapsed)).toFixed(1);
                }
            }, 100);

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: [{ role: 'user', content: prompt }],
                        stream: true,
                        max_tokens: 500
                    }),
                    signal: abortController.signal
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (line.trim() === '' || line.trim() === 'data: [DONE]') continue;
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));
                                chunkCount++;
                                $('chunkCount').textContent = chunkCount;
                                const content = data.choices?.[0]?.delta?.content;
                                if (content) {
                                    charCount += content.length;
                                    outputBytes += new TextEncoder().encode(content).length;
                                    $('charCount').textContent = charCount;
                                    const outputBox = $('output');
                                    outputBox.textContent += content;
                                    outputBox.scrollTop = outputBox.scrollHeight;
                                }
                            } catch (e) {
                                console.error('Parse error:', e);
                            }
                        }
                    }
                }
                updateStatus('done');
            } catch (error) {
                if (error.name === 'AbortError') {
                    updateStatus('');
                } else {
                    updateStatus('error');
                    alert(I18n.t('streamTest.streamRequestFailedPrefix') + error.message);
                }
            } finally {
                clearInterval(durationInterval);
                $('startBtn').classList.remove('hidden');
                $('stopBtn').classList.add('hidden');
            }
        }

        function stopStream() {
            if (abortController) abortController.abort();
        }

        document.addEventListener('DOMContentLoaded', initPrompt);
        document.addEventListener('i18n:langchange', () => applyStatusText(currentStatus));
    </script>
</body>
</html>
