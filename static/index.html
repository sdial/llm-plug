<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
    <title data-i18n="page.title">大模型格式转换器</title>
    <script src="/admin/static/tailwind.min.js?v=__STATIC_ASSET_VERSION__"></script>
    <script src="/admin/static/js/tailwind-config.js?v=__STATIC_ASSET_VERSION__"></script>
    <script src="/admin/static/js/htmx.min.js?v=__STATIC_ASSET_VERSION__"></script>
    <link rel="stylesheet" href="/admin/static/css/admin.css?v=__STATIC_ASSET_VERSION__">
</head>
<body class="min-h-screen">
    <!-- Header -->
    <header class="bg-white border-b border-surface-200 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 sm:py-4 flex items-center justify-between gap-4">
            <div class="min-w-0 flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-brand-500 flex items-center justify-center text-white text-base font-semibold flex-shrink-0">L</div>
                <div class="min-w-0">
                    <h1 class="text-base sm:text-lg font-semibold text-ink-900 truncate" data-i18n="header.title">LLM API 转换器</h1>
                    <p class="text-ink-400 text-xs mt-0.5 hidden sm:block" data-i18n="header.subtitle">OpenAI Chat Completions / OpenAI Response / Anthropic 三种格式互转 + 负载均衡</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-xs text-ink-400 hidden lg:inline">__APP_VERSION__ · __APP_RELEASE_DATE__</span>
                <button type="button" onclick="I18n.toggle()" class="btn-secondary px-2.5 py-1.5 text-xs font-medium" data-i18n-title="common.langLabel" data-i18n-aria="common.langLabel" title="切换语言" aria-label="切换语言">
                    <span data-i18n="common.langLabel">中/EN</span>
                </button>
                <button type="button" onclick="logoutAdmin()" class="text-ink-500 hover:text-ink-900 text-xs font-medium px-2 py-1.5" data-i18n="header.logout">退出</button>
            </div>
        </div>
    </header>

    <!-- Tab Navigation -->
    <nav id="mainNav" class="bg-white border-b border-surface-200 sticky z-20 main-nav-sticky" aria-label="主导航" data-i18n-aria="nav.mainNavLabel">
        <!-- Desktop tabs -->
        <div class="max-w-7xl mx-auto px-4 hidden md:flex gap-0.5 overflow-x-auto">
            <button type="button" onclick="switchTab('stats')" id="tab_stats" class="px-4 py-3 text-sm font-medium transition-colors tab-active" data-i18n="nav.stats">统计</button>
            <button type="button" onclick="switchTab('requests')" id="tab_requests" class="px-4 py-3 text-sm font-medium transition-colors tab-inactive" data-i18n="nav.requests">请求记录</button>
            <button type="button" onclick="switchTab('channels')" id="tab_channels" class="px-4 py-3 text-sm font-medium transition-colors tab-inactive" data-i18n="nav.channels">渠道管理</button>
            <button type="button" onclick="switchTab('lb')" id="tab_lb" class="px-4 py-3 text-sm font-medium transition-colors tab-inactive" data-i18n="nav.modelGroups">模型分组</button>
            <button type="button" onclick="switchTab('apikeys')" id="tab_apikeys" class="px-4 py-3 text-sm font-medium transition-colors tab-inactive" data-i18n="nav.apikeys">API Key</button>
            <button type="button" onclick="switchTab('storage')" id="tab_storage" class="px-4 py-3 text-sm font-medium transition-colors tab-inactive" data-i18n="nav.storage">存储管理</button>
            <button type="button" onclick="switchTab('context-shaping')" id="tab_context-shaping" class="px-4 py-3 text-sm font-medium transition-colors tab-inactive" data-i18n="nav.contextShaping">上下文塑形</button>
            <button type="button" onclick="switchTab('whitelist')" id="tab_whitelist" class="px-4 py-3 text-sm font-medium transition-colors tab-inactive" data-i18n="nav.whitelist">IP 白名单</button>
            <button type="button" onclick="switchTab('settings')" id="tab_settings" class="px-4 py-3 text-sm font-medium transition-colors tab-inactive" data-i18n="nav.settings">设置</button>
        </div>
        <!-- Mobile select -->
        <div class="md:hidden max-w-7xl mx-auto px-4 py-2">
            <select id="tabMobileSelect" aria-label="选择管理页面" data-i18n-aria="nav.mobileSelectLabel" onchange="switchTab(this.value)" class="w-full text-sm font-medium border border-surface-200 rounded-lg px-3 py-2.5 outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 bg-white">
                <option value="stats" data-i18n="nav.stats">统计</option>
                <option value="requests" data-i18n="nav.requests">请求记录</option>
                <option value="channels" data-i18n="nav.channels">渠道管理</option>
                <option value="apikeys" data-i18n="nav.apikeys">API Key</option>
                <option value="lb" data-i18n="nav.modelGroups">模型分组</option>
                <option value="storage" data-i18n="nav.storage">存储管理</option>
                <option value="context-shaping" data-i18n="nav.contextShaping">上下文塑形</option>
                <option value="whitelist" data-i18n="nav.whitelist">IP 白名单</option>
                <option value="settings" data-i18n="nav.settings">设置</option>
            </select>
        </div>
    </nav>

    <!-- Main Content -->
    <main id="admin-layout" class="max-w-7xl mx-auto px-4 sm:px-6 py-6 sm:py-8">
        <div id="admin-content" class="space-y-5 min-h-[24rem] animate-fade-in" hx-get="/admin/ui/stats" hx-trigger="load" hx-swap="innerHTML">
            <div class="loading-text flex items-center justify-center gap-2">
                <span class="spinner"></span>
                <span data-i18n="common.loading">加载中...</span>
            </div>
        </div>
    </main>

    <!-- Modals -->
    <!-- Channel Modal -->
    <div id="channelModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-panel max-w-2xl mx-4">
            <div class="p-6">
                <div class="flex justify-between items-start mb-6">
                    <h3 id="modalTitle" class="text-lg font-semibold text-ink-900" data-i18n="modals.channelAdd">添加渠道</h3>
                    <button type="button" onclick="closeModal()" class="text-ink-400 hover:text-ink-600 p-1 rounded-lg hover:bg-surface-100 transition" data-i18n-aria="common.close" aria-label="关闭">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
                <form id="channelForm" onsubmit="saveChannel(event)" class="space-y-4">
                    <input type="hidden" id="editId">
                    <div>
                        <label for="f_name" class="block text-sm font-medium text-ink-800 mb-1.5" data-i18n="modals.channelName">名称 <span class="text-brand-500">*</span></label>
                        <input type="text" id="f_name" required class="w-full px-3 py-2.5 text-sm">
                    </div>
                    <div class="rounded-xl border border-brand-200 bg-brand-50 p-3 flex flex-wrap sm:flex-nowrap items-center gap-2">
                        <label for="f_upstream_profile" class="shrink-0 text-sm font-medium text-ink-800" data-i18n="modals.upstreamProfile">选择提供商</label>
                        <select id="f_upstream_profile" class="min-w-32 flex-1 px-3 py-2 text-sm bg-white"></select>
                        <input type="hidden" id="f_catalog_revision">
                        <button type="button" onclick="applySelectedProfileUrls()" class="btn-secondary shrink-0 px-3 py-2 text-sm font-medium" data-i18n="modals.applyProfileUrls">应用档案 URL</button>
                    </div>
                    <div>
                        <div class="flex items-center justify-between mb-1.5">
                            <label class="block text-sm font-medium text-ink-800" data-i18n="modals.endpointsSection">接入点</label>
                            <button type="button" id="addEndpointBtn" onclick="addEndpointCard()" class="text-xs text-brand-600 hover:text-brand-700 font-medium transition" data-i18n="modals.addEndpoint">+ 添加接入点</button>
                        </div>
                        <div id="endpointsContainer" class="space-y-3"></div>
                        <div id="endpointsError" class="hidden mt-1 text-xs text-rose-600"></div>
                    </div>
                    <div>
                        <label for="f_api_key" class="block text-sm font-medium text-ink-800 mb-1.5">
                            API Key
                            <span class="help-tip" tabindex="0" role="button" aria-label="?">?
                                <span class="help-tip-text" data-i18n="modals.apiKeyDefaultHelp">渠道默认密钥；接入点可用密钥覆写单独覆盖。</span>
                            </span>
                        </label>
                        <div class="relative">
                            <input type="password" id="f_api_key" data-i18n-placeholder="modals.apiKeyPh" placeholder="上游服务的 API Key" class="w-full px-3 py-2.5 pr-10 text-sm">
                            <button type="button" onclick="toggleApiKeyVisibility()" class="absolute inset-y-0 right-0 flex items-center pr-3 text-ink-400 hover:text-ink-600 transition" data-i18n-title="modals.apiKeyToggle" data-i18n-aria="modals.apiKeyToggle" title="显示/隐藏 API Key" aria-label="切换 API Key 可见性">
                                <svg id="eyeIconShow" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                                <svg id="eyeIconHide" class="hidden w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.477 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L6.59 6.59m7.532 7.532l3.29 3.29M3 3l18 18"/></svg>
                            </button>
                        </div>
                    </div>
                    <div>
                        <div class="flex items-center justify-between mb-1.5">
                            <label class="block text-sm font-medium text-ink-800" data-i18n="modals.modelsList">模型列表</label>
                            <button type="button" id="fetchModelsBtn" onclick="fetchModels()" class="text-xs text-brand-600 hover:text-brand-700 font-medium flex items-center gap-1">
                                <svg id="fetchModelsSpinner" class="hidden w-3 h-3 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                <span data-i18n="modals.fetchModels">获取模型</span>
                            </button>
                        </div>
                        <input type="hidden" id="f_models">
                        <div id="f_models_container"></div>
                        <div id="modelSelectPanel" class="hidden mt-2 border border-surface-200 rounded-lg bg-white shadow-card">
                            <div class="p-2 border-b border-surface-100">
                                <input type="text" id="modelSearchInput" data-i18n-placeholder="modals.searchModelPh" placeholder="搜索模型..." class="w-full text-sm border border-surface-200 rounded px-2 py-1.5 outline-none focus:border-brand-500">
                            </div>
                            <div id="modelSelectList" class="max-h-48 overflow-y-auto p-2 space-y-1"></div>
                            <div class="p-2 border-t border-surface-100 flex justify-end gap-2">
                                <button type="button" onclick="closeModelSelectPanel()" class="btn-secondary px-3 py-1.5 text-sm font-medium" data-i18n="common.cancel">取消</button>
                                <button type="button" onclick="confirmModelSelect()" class="btn-primary px-3 py-1.5 text-sm font-medium" data-i18n="modals.replaceList">替换当前列表</button>
                            </div>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div>
                            <label for="f_weight" class="block text-sm font-medium text-ink-800 mb-1.5">
                                <span data-i18n="modals.weight">权重</span>
                                <span class="help-tip" tabindex="0" role="button" aria-label="?">
                                    ?
                                    <span class="help-tip-text" data-i18n="modals.weightHelp">同一优先级内按权重分流，数值越大命中概率越高。</span>
                                </span>
                            </label>
                            <input type="number" id="f_weight" value="1" min="1" class="w-full px-3 py-2.5 text-sm">
                        </div>
                        <div>
                            <label for="f_priority" class="block text-sm font-medium text-ink-800 mb-1.5">
                                <span data-i18n="modals.priority">优先级</span>
                                <span class="help-tip" tabindex="0" role="button" aria-label="?">
                                    ?
                                    <span class="help-tip-text" data-i18n="modals.priorityHelp">数值越小越优先；高优先级失败后才会回落到低优先级。</span>
                                </span>
                            </label>
                            <input type="number" id="f_priority" value="1" min="1" class="w-full px-3 py-2.5 text-sm">
                        </div>
                        <div>
                            <label for="f_rate_limit_rpm" class="block text-sm font-medium text-ink-800 mb-1.5">
                                <span data-i18n="modals.rateLimitRpm">限速（RPM）</span>
                                <span class="text-ink-400 font-normal text-xs" data-i18n="common.optional">（可选）</span>
                                <span class="help-tip" tabindex="0" role="button" aria-label="?">
                                    ?
                                    <span class="help-tip-text" data-i18n="modals.rateLimitRpmHelp">上游每分钟最大请求数（如 NVIDIA 免费层为 40）。超出时请求在代理侧排队等待，避免直接撞 429。留空或 0 = 不限速。</span>
                                </span>
                            </label>
                            <input type="number" id="f_rate_limit_rpm" min="0" placeholder="不限速" class="w-full px-3 py-2.5 text-sm">
                        </div>
                    </div>
                    <div>
                        <label for="f_socks5_proxy" class="block text-sm font-medium text-ink-800 mb-1.5">
                            <span data-i18n="modals.socks5Proxy">SOCKS5 代理</span>
                            <span class="text-ink-400 font-normal text-xs" data-i18n="common.optional">（可选）</span>
                        </label>
                        <input type="text" id="f_socks5_proxy" placeholder="socks5://user:pass@127.0.0.1:1080" class="w-full px-3 py-2.5 text-sm font-mono">
                    </div>
                    <div class="flex items-center justify-between pt-4 border-t border-surface-100">
                        <div class="flex items-center gap-4">
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" id="f_enabled" checked>
                                <span class="text-sm text-ink-800" data-i18n="common.enabled">启用</span>
                            </label>
                            <button type="button" id="deleteChannelBtn" onclick="deleteChannelFromModal()" class="text-sm text-brand-600 hover:text-brand-700 font-medium hidden transition" data-i18n="modals.deleteChannel">删除渠道</button>
                        </div>
                        <div class="flex gap-3">
                            <button type="button" onclick="closeModal()" class="btn-secondary px-4 py-2 text-sm font-medium" data-i18n="common.cancel">取消</button>
                            <button type="submit" class="btn-primary px-4 py-2 text-sm font-medium" data-i18n="common.save">保存</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- API Key Modal -->
    <div id="keyModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="keyModalTitle">
        <div class="modal-panel max-w-md mx-4">
            <div class="p-6">
                <div class="flex justify-between items-start mb-6">
                    <h3 id="keyModalTitle" class="text-lg font-semibold text-ink-900" data-i18n="modals.keyCreate">创建 API Key</h3>
                    <button type="button" onclick="closeKeyModal()" class="text-ink-400 hover:text-ink-600 p-1 rounded-lg hover:bg-surface-100 transition" data-i18n-aria="common.close" aria-label="关闭">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
                <form id="keyForm" onsubmit="saveApiKey(event)" class="space-y-4">
                    <input type="hidden" id="keyEditId">
                    <div>
                        <label for="fk_name" class="block text-sm font-medium text-ink-800 mb-1.5" data-i18n="common.name">名称 <span class="text-brand-500">*</span></label>
                        <input type="text" id="fk_name" required class="w-full px-3 py-2.5 text-sm">
                    </div>
                    <div>
                        <label for="fk_key" class="block text-sm font-medium text-ink-800 mb-1.5">
                            <span data-i18n="modals.keyLabel">API Key</span>
                            <span class="text-ink-400 font-normal text-xs" data-i18n="modals.keyAutoHint">（留空则自动生成）</span>
                        </label>
                        <input type="text" id="fk_key" class="w-full px-3 py-2.5 text-sm font-mono" data-i18n-placeholder="modals.keyCreatePh" placeholder="留空自动生成，或手动输入自定义 Key">
                    </div>
                    <div>
                        <label for="fk_notes" class="block text-sm font-medium text-ink-800 mb-1.5" data-i18n="modals.keyNotes">备注</label>
                        <input type="text" id="fk_notes" class="w-full px-3 py-2.5 text-sm" data-i18n-placeholder="modals.keyNotesPh" placeholder="可选">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-ink-800 mb-1.5">
                            <span data-i18n="modals.keyAllowedModels">允许模型</span>
                            <span class="text-ink-400 font-normal text-xs" data-i18n="modals.keyAllowedModelsHint">（逗号分隔，留空表示允许全部模型）</span>
                        </label>
                        <input type="hidden" id="fk_models">
                        <div id="fk_models_container"></div>
                    </div>
                    <div class="flex justify-end gap-3 pt-4 border-t border-surface-100">
                        <button type="button" onclick="closeKeyModal()" class="btn-secondary px-4 py-2 text-sm font-medium" data-i18n="common.cancel">取消</button>
                        <button type="submit" class="btn-primary px-4 py-2 text-sm font-medium" data-i18n="common.save">保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Copy Key Modal -->
    <div id="copyKeyModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="copyKeyModalTitle">
        <div class="modal-panel max-w-md mx-4">
            <div class="p-6">
                <div class="flex justify-between items-start mb-4">
                    <h3 id="copyKeyModalTitle" class="text-lg font-semibold text-ink-900" data-i18n="modals.copyKeyTitle">API Key 已创建</h3>
                    <button type="button" onclick="closeCopyKeyModal()" class="text-ink-400 hover:text-ink-600 p-1 rounded-lg hover:bg-surface-100 transition" data-i18n-aria="common.close" aria-label="关闭">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
                <p class="text-sm text-ink-600 mb-3" data-i18n="modals.copyKeyHint">请复制并妥善保存，该 Key 不会再次显示完整内容。</p>
                <div class="bg-ink-900 rounded-xl p-4 mb-4 overflow-x-auto">
                    <code id="copyKeyText" class="text-sm text-emerald-400 break-all font-mono"></code>
                </div>
                <div class="flex justify-end">
                    <button type="button" onclick="doCopyKey()" class="btn-primary px-4 py-2 text-sm font-medium" data-i18n="modals.copyKeyBtn">复制到剪贴板</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Request Detail Modal -->
    <div id="requestDetailModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="requestDetailModalTitle">
        <div class="modal-panel max-w-2xl mx-4">
            <div class="p-6">
                <div class="flex justify-between items-start mb-4">
                    <h3 id="requestDetailModalTitle" class="text-lg font-semibold text-ink-900 flex items-center gap-2" data-i18n="modals.requestDetail">请求详情</h3>
                    <button type="button" onclick="closeRequestDetailModal()" class="text-ink-400 hover:text-ink-600 p-1 rounded-lg hover:bg-surface-100 transition" data-i18n-aria="common.close" aria-label="关闭">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
                <div id="requestDetailContent" class="space-y-3 text-sm max-h-[60vh] overflow-y-auto"></div>
            </div>
        </div>
    </div>

    <!-- Test Modal -->
    <div id="testModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="testModalTitle">
        <div class="modal-panel max-w-md mx-4">
            <div class="p-6">
                <div class="flex justify-between items-start mb-4">
                    <h3 id="testModalTitle" class="text-lg font-semibold text-ink-900" data-i18n="modals.testTitle">测试连接</h3>
                    <button type="button" onclick="closeTestModal()" class="text-ink-400 hover:text-ink-600 p-1 rounded-lg hover:bg-surface-100 transition" data-i18n-aria="common.close" aria-label="关闭">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
                <div class="space-y-4">
                    <div>
                        <label for="testModelSelect" class="block text-sm font-medium text-ink-800 mb-1.5" data-i18n="modals.testSelectModel">选择模型</label>
                        <select id="testModelSelect" class="w-full px-3 py-2.5 text-sm"></select>
                    </div>
                    <div id="testEndpointList" class="space-y-2"></div>
                </div>
                <div class="flex justify-end pt-4 border-t border-surface-100 mt-4">
                    <button type="button" onclick="closeTestModal()" class="btn-secondary px-4 py-2 text-sm font-medium" data-i18n="common.close">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div id="confirmModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
        <div class="modal-panel max-w-sm mx-4">
            <div class="p-6">
                <div class="flex justify-between items-start mb-4">
                    <h3 id="confirmTitle" class="text-lg font-semibold text-ink-900" data-i18n="modals.confirmTitle">确认操作</h3>
                    <button type="button" onclick="closeConfirmModal()" class="text-ink-400 hover:text-ink-600 p-1 rounded-lg hover:bg-surface-100 transition" data-i18n-aria="common.close" aria-label="关闭">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
                <p id="confirmMessage" class="text-sm text-ink-600 mb-6"></p>
                <div class="flex justify-end gap-3">
                    <button type="button" onclick="closeConfirmModal()" class="btn-secondary px-4 py-2 text-sm font-medium" data-i18n="common.cancel">取消</button>
                    <button type="button" onclick="confirmAction()" id="confirmBtn" class="btn-danger px-4 py-2 text-sm font-medium" data-i18n="modals.confirmBtn">确认</button>
                </div>
            </div>
        </div>
    </div>

    <!-- PII Filter Toggle Confirm Modal -->
    <div id="piiToggleConfirmModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="piiToggleConfirmTitle">
        <div class="modal-panel max-w-sm mx-4">
            <div class="p-6">
                <div class="flex justify-between items-start mb-4">
                    <h3 id="piiToggleConfirmTitle" class="text-lg font-semibold text-ink-900"></h3>
                    <button type="button" onclick="closePiiToggleConfirm()" class="text-ink-400 hover:text-ink-600 p-1 rounded-lg hover:bg-surface-100 transition" data-i18n-aria="common.close" aria-label="关闭">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
                <p id="piiToggleConfirmMessage" class="text-sm text-ink-600 mb-6"></p>
                <div class="flex justify-end gap-3">
                    <button type="button" onclick="closePiiToggleConfirm()" class="btn-secondary px-4 py-2 text-sm font-medium" data-i18n="common.cancel">取消</button>
                    <button type="button" onclick="confirmPiiToggle()" id="piiToggleConfirmBtn" class="btn-primary px-4 py-2 text-sm font-medium"></button>
                </div>
            </div>
        </div>
    </div>

    <!-- Model Group Modal -->
    <div id="modelGroupModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modelGroupModalTitle">
        <div class="modal-panel max-w-2xl mx-4">
            <div class="p-6">
                <div class="flex justify-between items-start mb-4">
                    <h3 id="modelGroupModalTitle" class="text-lg font-semibold text-ink-900" data-i18n="modals.mgAdd">添加模型组</h3>
                    <button type="button" onclick="closeModelGroupModal()" class="text-ink-400 hover:text-ink-600 p-1 rounded-lg hover:bg-surface-100 transition" data-i18n-aria="common.close" aria-label="关闭">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
                <form id="modelGroupForm" onsubmit="saveModelGroup(event)">
                    <input type="hidden" id="modelGroupId">
                    <div class="space-y-4">
                        <div>
                            <label for="modelGroupName" class="block text-sm font-medium text-ink-800 mb-1.5">
                                <span data-i18n="modals.mgName">组名</span> <span class="text-brand-500">*</span>
                            </label>
                            <input type="text" id="modelGroupName" required data-i18n-placeholder="modals.mgNamePh" placeholder="如 glm5-group" class="w-full px-3 py-2.5 text-sm">
                            <p class="text-xs text-ink-400 mt-1" data-i18n="modals.mgNameHelp">客户端请求时使用此名称</p>
                            <p id="modelGroupNameCollision" class="hidden mt-1 text-xs font-medium text-amber-600 flex items-start gap-1"></p>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-ink-800 mb-1.5">
                                <span data-i18n="modals.mgModels">模型列表</span> <span class="text-brand-500">*</span>
                            </label>
                            <div id="modelGroupModelsContainer" class="space-y-2"></div>
                            <button type="button" onclick="addModelInput()" class="mt-2 text-sm text-brand-600 hover:text-brand-700 font-medium transition" data-i18n="modals.mgAddModel">+ 添加模型</button>
                            <p class="text-xs text-ink-400 mt-1" data-i18n="modals.mgModelsHelp">按顺序 Fallback，排在前面的优先使用</p>
                        </div>
                        <div class="flex items-center gap-4 flex-wrap">
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" id="modelGroupEnabled" checked>
                                <span class="text-sm text-ink-800" data-i18n="common.enabled">启用</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="checkbox" id="modelGroupLazySticky">
                                <span class="text-sm text-ink-800" data-i18n="modelGroups.lazySticky">惰性粘滞</span>
                                <span class="help-tip" tabindex="0" role="button" aria-label="?">?
                                    <span class="help-tip-text" data-i18n="modelGroups.lazyStickyHelp">开启后该组同模型多渠道按“一个可用就不切，出错才切且不回头”粘滞；关闭即轮询</span>
                                </span>
                            </label>
                        </div>
                    </div>
                    <div class="flex justify-end gap-3 pt-4 border-t border-surface-100 mt-4">
                        <button type="button" onclick="closeModelGroupModal()" class="btn-secondary px-4 py-2 text-sm font-medium" data-i18n="common.cancel">取消</button>
                        <button type="submit" class="btn-primary px-4 py-2 text-sm font-medium" data-i18n="common.save">保存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Model Capability Modal -->
    <div id="modelCapModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modelCapModalTitle">
        <div class="modal-panel max-w-xs mx-4">
            <div class="p-5">
                <div class="flex justify-between items-start mb-4">
                    <h3 id="modelCapModalTitle" class="text-base font-semibold text-ink-900" data-i18n="modals.capTitle">模型能力</h3>
                    <button type="button" onclick="closeModelCapModal()" class="text-ink-400 hover:text-ink-600 p-1 rounded-lg hover:bg-surface-100 transition" data-i18n-aria="common.close" aria-label="关闭">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
                <div class="mb-4">
                    <span id="modelCapName" class="inline-block text-sm font-medium text-ink-900 bg-surface-100 px-2.5 py-1 rounded-lg"></span>
                </div>
                <div class="space-y-3 mb-5">
                    <label class="block text-sm text-ink-700"><span data-i18n="modals.capImage">图片输入</span><select id="capImage" class="w-full mt-1 px-2 py-2"><option value="" data-i18n="modals.capInherit">继承档案</option><option value="supported" data-i18n="modals.capSupported">支持</option><option value="unsupported" data-i18n="modals.capUnsupported">不支持</option><option value="unknown" data-i18n="modals.capUnknown">未知</option></select></label>
                    <label class="block text-sm text-ink-700"><span data-i18n="modals.capAudio">音频输入</span><select id="capAudio" class="w-full mt-1 px-2 py-2"><option value="" data-i18n="modals.capInherit">继承档案</option><option value="supported" data-i18n="modals.capSupported">支持</option><option value="unsupported" data-i18n="modals.capUnsupported">不支持</option><option value="unknown" data-i18n="modals.capUnknown">未知</option></select></label>
                    <label class="block text-sm text-ink-700"><span data-i18n="modals.capFile">文件输入</span><select id="capFile" class="w-full mt-1 px-2 py-2"><option value="" data-i18n="modals.capInherit">继承档案</option><option value="supported" data-i18n="modals.capSupported">支持</option><option value="unsupported" data-i18n="modals.capUnsupported">不支持</option><option value="unknown" data-i18n="modals.capUnknown">未知</option></select></label>
                </div>
                <div class="flex gap-2 pt-3 border-t border-surface-100">
                    <button type="button" onclick="resetModelCap()" class="btn-secondary px-3 py-1.5 text-xs font-medium" data-i18n="common.reset">重置</button>
                    <button type="button" onclick="saveModelCap()" class="btn-primary px-3 py-1.5 text-xs font-medium ml-auto" data-i18n="common.save">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
