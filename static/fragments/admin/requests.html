<!-- 请求记录 Tab -->
        <div id="requestsTab">
            <!-- 搜索表单 -->
            <div class="card p-4 mb-4">
                <div class="flex flex-wrap gap-3 items-end">
                    <div class="w-full sm:w-auto">
                        <label class="block text-xs text-ink-600 mb-1" data-i18n="requests.filterModel">模型</label>
                        <input type="text" id="reqFilterModel" data-i18n-placeholder="requests.filterModelPh" placeholder="模型名称" class="text-sm border border-surface-200 rounded-lg px-2 py-1.5 outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500 bg-white w-full sm:w-64">
                    </div>
                    <div class="w-full sm:w-auto">
                        <label class="block text-xs text-ink-600 mb-1" data-i18n="requests.filterChannel">渠道</label>
                        <select id="reqFilterChannel" class="text-sm border border-surface-200 rounded-lg px-2 py-1.5 outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500 bg-white w-full sm:w-40">
                            <option value="" data-i18n="requests.filterAllChannels">全部渠道</option>
                        </select>
                    </div>
                    <div class="w-full sm:w-auto">
                        <label class="block text-xs text-ink-600 mb-1" data-i18n="requests.filterApiKey">API Key</label>
                        <select id="reqFilterApiKeyId" class="text-sm border border-surface-200 rounded-lg px-2 py-1.5 outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500 bg-white w-full sm:w-40">
                            <option value="" data-i18n="requests.filterAllApiKeys">全部 API Key</option>
                        </select>
                    </div>
                    <div class="w-full sm:w-auto">
                        <label class="block text-xs text-ink-600 mb-1" data-i18n="requests.filterStatus">状态</label>
                        <select id="reqFilterSuccess" class="text-sm border border-surface-200 rounded-lg px-2 py-1.5 outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500 bg-white w-full sm:w-28">
                            <option value="" data-i18n="requests.filterAll">全部</option>
                            <option value="true" data-i18n="requests.filterSuccess">成功</option>
                            <option value="false" data-i18n="requests.filterFail">失败</option>
                        </select>
                    </div>
                    <div class="w-full sm:w-auto">
                        <label class="block text-xs text-ink-600 mb-1" data-i18n="requests.filterStart">开始时间</label>
                        <input type="datetime-local" id="reqFilterStart" class="text-sm border border-surface-200 rounded-lg px-2 py-1.5 outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500 bg-white w-full sm:w-auto">
                    </div>
                    <div class="w-full sm:w-auto">
                        <label class="block text-xs text-ink-600 mb-1" data-i18n="requests.filterEnd">结束时间</label>
                        <input type="datetime-local" id="reqFilterEnd" class="text-sm border border-surface-200 rounded-lg px-2 py-1.5 outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500 bg-white w-full sm:w-auto">
                    </div>

                    <div class="flex gap-2 w-full sm:w-auto">
                        <button onclick="searchRequests()" class="btn-primary text-sm px-3 py-1.5 font-medium flex-1 sm:flex-initial" data-i18n="requests.searchBtn">搜索</button>
                        <button onclick="resetRequestFilters()" class="btn-secondary text-sm px-3 py-1.5 font-medium flex-1 sm:flex-initial" data-i18n="requests.resetBtn">重置</button>
                    </div>
                </div>
            </div>

            <!-- 表格 -->
            <div class="request-table-shell mb-4">
                <table class="request-log-table w-full text-sm responsive-card">
                    <colgroup>
                        <col style="width:110px">
                        <col style="width:114px">
                        <col style="width:118px">
                        <col style="width:124px">
                        <col style="width:142px">
                        <col style="width:106px">
                        <col style="width:78px">
                        <col style="width:84px">
                        <col style="width:84px">
                        <col style="width:70px">
                        <col style="width:94px">
                        <col style="width:76px">
                    </colgroup>
                    <thead>
                        <tr>
                            <th class="text-left py-3 px-3" data-i18n="requests.colTime">时间</th>
                            <th class="text-left py-3 px-2" data-i18n="requests.colChannel">渠道</th>
                            <th class="text-left py-3 px-2" data-i18n="requests.colClientIp">客户端 IP</th>
                            <th class="text-left py-3 px-2" data-i18n="requests.colApiKey">API Key</th>
                            <th class="text-left py-3 px-2" data-i18n="requests.colModel">模型</th>
                            <th class="text-right py-3 px-2" data-i18n="requests.colInputTok" data-i18n-title="requests.colInputTokTitle" title="输入 Token 数；括号为命中缓存的 cache_read_input_tokens">输入 Tok</th>
                            <th class="text-right py-3 px-2" data-i18n="requests.colOutputTok" data-i18n-title="requests.colOutputTokTitle" title="输出 Token 数">输出 Tok</th>
                            <th class="text-right py-3 px-2" data-i18n="requests.colLatency" data-i18n-title="requests.colLatencyTitle" title="整体耗时（毫秒）">总耗时</th>
                            <th class="text-right py-3 px-2" data-i18n="requests.colFirstTok" data-i18n-title="requests.colFirstTokTitle" title="首个 Token 返回耗时（毫秒）">首 Tok</th>
                            <th class="text-right py-3 px-2" data-i18n="requests.colSpeed" data-i18n-title="requests.colSpeedTitle" title="输出速率：tokens/秒">速率</th>
                            <th class="text-left py-3 px-2" data-i18n="requests.colFinishReason">结束原因</th>
                            <th class="text-center py-3 px-2" data-i18n="requests.colStatus">状态</th>
                        </tr>
                    </thead>
                    <tbody id="requestsTbody">
                        <tr><td colspan="12" class="py-4 text-center text-ink-400 text-sm" data-i18n="common.loading">加载中...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- 分页器 -->
            <div class="flex items-center justify-between flex-wrap gap-2">
                <div class="text-sm text-ink-600">
                    <span data-i18n="requests.totalPrefix">共</span> <span id="reqTotal">0</span> <span data-i18n="requests.totalSuffix">条</span>
                </div>
                <div class="flex items-center gap-2 flex-wrap">
                    <select id="reqPageSize" onchange="changeRequestPageSize()" class="text-sm border border-surface-200 rounded-lg px-2 py-1.5 outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500 bg-white">
                        <option value="10">10 <span data-i18n="requests.pageSizeUnit">条/页</span></option>
                        <option value="20">20 <span data-i18n="requests.pageSizeUnit">条/页</span></option>
                        <option value="50">50 <span data-i18n="requests.pageSizeUnit">条/页</span></option>
                        <option value="100">100 <span data-i18n="requests.pageSizeUnit">条/页</span></option>
                    </select>
                    <button onclick="prevRequestPage()" id="reqPrevBtn" class="btn-secondary text-sm px-3 py-1.5 font-medium" data-i18n="requests.prevPage">上一页</button>
                    <span class="text-sm text-ink-600"><span data-i18n="requests.pagePrefix">第</span> <span id="reqPage">1</span> <span data-i18n="requests.pageSuffix">页</span></span>
                    <button onclick="nextRequestPage()" id="reqNextBtn" class="btn-secondary text-sm px-3 py-1.5 font-medium" data-i18n="requests.nextPage">下一页</button>
                </div>
            </div>
        </div>
