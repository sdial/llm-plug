<!-- 请求记录 Tab -->
<div id="requestsTab">
    <!-- Search Form -->
    <div class="card p-4 mb-4">
        <div class="flex flex-nowrap items-end gap-3 overflow-x-auto pb-1">
            <div class="flex flex-col gap-1 shrink-0">
                <label class="text-xs text-ink-500 font-medium" data-i18n="requests.filterModel">模型</label>
                <input type="text" id="reqFilterModel" data-i18n-placeholder="requests.filterModelPh" placeholder="模型名称" class="text-sm border border-surface-200 rounded-lg px-2.5 py-2 outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 bg-white w-40">
            </div>
            <div class="flex flex-col gap-1 shrink-0">
                <label class="text-xs text-ink-500 font-medium" data-i18n="requests.filterChannel">渠道</label>
                <select id="reqFilterChannel" class="text-sm border border-surface-200 rounded-lg px-2.5 py-2 outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 bg-white w-28">
                    <option value="" data-i18n="requests.filterAllChannels">全部渠道</option>
                </select>
            </div>
            <div class="flex flex-col gap-1 shrink-0">
                <label class="text-xs text-ink-500 font-medium" data-i18n="requests.filterApiKey">API Key</label>
                <select id="reqFilterApiKeyId" class="text-sm border border-surface-200 rounded-lg px-2.5 py-2 outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 bg-white w-28">
                    <option value="" data-i18n="requests.filterAllApiKeys">全部 API Key</option>
                </select>
            </div>
            <div class="flex flex-col gap-1 shrink-0">
                <label class="text-xs text-ink-500 font-medium" data-i18n="requests.filterStatus">状态</label>
                <select id="reqFilterSuccess" class="text-sm border border-surface-200 rounded-lg px-2.5 py-2 outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 bg-white w-24">
                    <option value="" data-i18n="requests.filterAll">全部</option>
                    <option value="true" data-i18n="requests.filterSuccess">成功</option>
                    <option value="false" data-i18n="requests.filterFail">失败</option>
                </select>
            </div>
            <div class="flex flex-col gap-1 shrink-0">
                <label class="text-xs text-ink-500 font-medium flex items-center gap-1.5" data-i18n="requests.filterTimeRange">时间范围
                    <span id="reqFilterTzHint" class="font-mono text-ink-400" title=""></span>
                </label>
                <div class="flex items-center gap-1.5">
                    <input type="datetime-local" id="reqFilterStart" class="text-sm border border-surface-200 rounded-lg px-2 py-2 outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 bg-white w-40">
                    <span class="text-ink-400">—</span>
                    <input type="datetime-local" id="reqFilterEnd" class="text-sm border border-surface-200 rounded-lg px-2 py-2 outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 bg-white w-40">
                </div>
            </div>
            <div class="flex gap-2 shrink-0">
                <button type="button" onclick="searchRequests()" class="btn-primary text-sm px-3.5 py-2 font-medium flex items-center justify-center gap-1.5" data-i18n-aria="common.search" aria-label="搜索">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                    <span data-i18n="requests.searchBtn">搜索</span>
                </button>
                <button type="button" onclick="resetRequestFilters()" class="btn-secondary text-sm px-3.5 py-2 font-medium" data-i18n="requests.resetBtn">重置</button>
                <button type="button" id="reqAutoRefreshBtn" onclick="toggleRequestsAutoRefresh()" class="btn-secondary text-sm px-3.5 py-2 font-medium flex items-center gap-1.5" data-i18n-title="requests.autoRefreshTitle" data-i18n-aria="requests.autoRefresh" aria-label="实时刷新" title="实时刷新">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12a9 9 0 11-6.219-8.56"/><polyline points="21 3 21 9 15 9"/></svg>
                    <span id="reqAutoRefreshLabel" data-i18n="requests.autoRefresh">实时刷新</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Table -->
    <div class="request-table-shell mb-4">
        <table class="request-log-table w-full text-sm responsive-card">
            <colgroup>
                <col style="width:110px">
                <col>
                <col>
                <col>
                <col>
                <col style="width:106px">
                <col style="width:78px">
                <col style="width:82px">
                <col style="width:82px">
                <col style="width:74px">
                <col>
                <col style="width:80px">
            </colgroup>
            <thead>
                <tr>
                    <th class="text-left py-3 px-3" data-i18n="requests.colTime">时间</th>
                    <th class="text-left py-3 px-2" data-i18n="requests.colChannel">渠道</th>
                    <th class="text-left py-3 px-2" data-i18n="requests.colClientIp">客户端 IP</th>
                    <th class="text-left py-3 px-2" data-i18n="requests.colApiKey">API Key</th>
                    <th class="text-left py-3 px-2" data-i18n="requests.colModel">模型</th>
                    <th class="text-right py-3 px-2" data-i18n="requests.colInputTok" data-i18n-title="requests.colInputTokTitle" title="输入 Token 数">输入 Tok</th>
                    <th class="text-right py-3 px-2" data-i18n="requests.colOutputTok" data-i18n-title="requests.colOutputTokTitle" title="输出 Token 数">输出 Tok</th>
                    <th class="text-right py-3 px-2" data-i18n="requests.colLatency" data-i18n-title="requests.colLatencyTitle" title="整体耗时（毫秒）">总耗时</th>
                    <th class="text-right py-3 px-2" data-i18n="requests.colFirstTok" data-i18n-title="requests.colFirstTokTitle" title="首个 Token 返回耗时（毫秒）">首 Tok</th>
                    <th class="text-right py-3 px-2" data-i18n="requests.colSpeed" data-i18n-title="requests.colSpeedTitle" title="输出速率：tokens/秒">速率</th>
                    <th class="text-left py-3 px-2" data-i18n="requests.colFinishReason">结束原因</th>
                    <th class="text-center py-3 px-2" data-i18n="requests.colStatus">状态</th>
                </tr>
            </thead>
            <tbody id="requestsTbody">
                <tr><td colspan="12" class="py-4 text-center text-ink-400 text-sm" data-i18n="common.loading">加载中...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <div class="flex items-center justify-between flex-wrap gap-3">
        <div class="text-sm text-ink-600">
            <span data-i18n="requests.totalPrefix">共</span>
            <span id="reqTotal" class="font-medium text-ink-900">0</span>
            <span data-i18n="requests.totalSuffix">条</span>
        </div>
        <div class="flex items-center gap-2 flex-wrap">
            <select id="reqPageSize" onchange="changeRequestPageSize()" class="text-sm border border-surface-200 rounded-lg px-2.5 py-1.5 outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 bg-white">
                <option value="10" selected>10</option>
                <option value="20">20</option>
                <option value="50">50</option>
                <option value="100">100</option>
            </select>
            <span class="text-sm text-ink-500" data-i18n="requests.pageSizeUnit">条/页</span>
            <button type="button" onclick="prevRequestPage()" id="reqPrevBtn" class="btn-secondary text-sm px-3 py-1.5 font-medium" data-i18n="requests.prevPage">上一页</button>
            <span class="text-sm text-ink-600 px-2"><span data-i18n="requests.pagePrefix">第</span> <span id="reqPage" class="font-medium text-ink-900">1</span> <span data-i18n="requests.pageSuffix">页</span></span>
            <button type="button" onclick="nextRequestPage()" id="reqNextBtn" class="btn-secondary text-sm px-3 py-1.5 font-medium" data-i18n="requests.nextPage">下一页</button>
        </div>
    </div>
</div>
