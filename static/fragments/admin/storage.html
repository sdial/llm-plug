<!-- 存储管理 Tab -->
<div id="storageTab">
    <!-- Header -->
    <div class="flex items-center justify-between mb-5">
        <h2 class="text-sm font-semibold text-ink-900" data-i18n="storage.title">存储管理</h2>
        <button type="button" onclick="loadStorageStats()" class="btn-secondary text-sm px-3 py-1.5 font-medium flex items-center gap-1.5" data-i18n-aria="storage.refreshTitle" aria-label="刷新统计">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            <span data-i18n="storage.refreshBtn">刷新</span>
        </button>
    </div>

    <!-- Overview Cards -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
        <div class="card p-4">
            <div class="text-xs text-ink-500 mb-1" data-i18n="storage.totalSize">总占用空间</div>
            <div class="text-xl font-bold text-ink-900" id="storageTotalSize">-</div>
        </div>
        <div class="card p-4">
            <div class="text-xs text-ink-500 mb-1" data-i18n="storage.logsDir">Logs 目录</div>
            <div class="text-lg font-semibold text-ink-900" id="storageLogsSize">-</div>
        </div>
        <div class="card p-4">
            <div class="text-xs text-ink-500 mb-1" data-i18n="storage.rawLogsTitle">Request Raw Logs</div>
            <div class="text-lg font-semibold text-ink-900" id="storageRawLogsSize">-</div>
        </div>
        <div class="card p-4">
            <div class="text-xs text-ink-500 mb-1" data-i18n="storage.otherData">其他数据</div>
            <div class="text-lg font-semibold text-ink-900" id="storageOtherSize">-</div>
        </div>
    </div>

    <!-- Logs Section -->
    <div class="card mb-5">
        <div class="px-4 py-3 border-b border-surface-200">
            <h3 class="text-sm font-medium text-ink-900" data-i18n="storage.logsTitle">Logs 文件</h3>
            <p class="text-xs text-ink-500 mt-0.5" data-i18n="storage.logsDesc">仅展示，不提供删除</p>
        </div>
        <div class="p-4 overflow-x-auto">
            <table class="w-full text-sm">
                <thead class="text-left text-xs text-ink-500 border-b border-surface-200">
                    <tr>
                        <th class="py-2 pr-4 font-medium" data-i18n="storage.colFileName">文件名</th>
                        <th class="py-2 pr-4 font-medium" data-i18n="storage.colSize">大小</th>
                        <th class="py-2 font-medium" data-i18n="storage.colModified">修改时间</th>
                    </tr>
                </thead>
                <tbody id="logsFilesList">
                    <tr><td colspan="3" class="py-4 text-center text-ink-400" data-i18n="common.loading">加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Raw Logs Section -->
    <div class="card mb-5">
        <div class="px-4 py-3 border-b border-surface-200">
            <h3 class="text-sm font-medium text-ink-900" data-i18n="storage.rawLogsTitle">Request Raw Logs（按月）</h3>
            <p class="text-xs text-ink-500 mt-0.5" data-i18n="storage.rawLogsDesc">仅支持单独删除某个月份数据</p>
        </div>
        <div class="p-4 overflow-x-auto">
            <table class="w-full text-sm">
                <thead class="text-left text-xs text-ink-500 border-b border-surface-200">
                    <tr>
                        <th class="py-2 pr-4 font-medium" data-i18n="storage.colMonth">月份</th>
                        <th class="py-2 pr-4 font-medium" data-i18n="storage.colFileName">文件名</th>
                        <th class="py-2 pr-4 font-medium" data-i18n="storage.colSize">大小</th>
                        <th class="py-2 pr-4 font-medium" data-i18n="storage.colRecords">记录数</th>
                        <th class="py-2 font-medium" data-i18n="common.actions">操作</th>
                    </tr>
                </thead>
                <tbody id="rawLogsMonthsList">
                    <tr><td colspan="5" class="py-4 text-center text-ink-400" data-i18n="common.loading">加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Other Files Section -->
    <div class="card">
        <div class="px-4 py-3 border-b border-surface-200">
            <h3 class="text-sm font-medium text-ink-900" data-i18n="storage.otherTitle">其他数据文件</h3>
            <p class="text-xs text-ink-500 mt-0.5" data-i18n="storage.otherDesc">核心数据文件，仅展示，不提供删除</p>
        </div>
        <div class="p-4 overflow-x-auto">
            <table class="w-full text-sm">
                <thead class="text-left text-xs text-ink-500 border-b border-surface-200">
                    <tr>
                        <th class="py-2 pr-4 font-medium" data-i18n="storage.colFileName">文件名</th>
                        <th class="py-2 font-medium" data-i18n="storage.colSize">大小</th>
                    </tr>
                </thead>
                <tbody id="otherFilesList">
                    <tr><td colspan="2" class="py-4 text-center text-ink-400" data-i18n="common.loading">加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
