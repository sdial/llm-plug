<!-- 模型分组 Tab -->
<div id="lbTab">
    <div class="flex items-start justify-between mb-5 gap-3 flex-wrap">
        <div class="min-w-0">
            <h2 class="text-sm font-semibold text-ink-900" data-i18n="modelGroups.title">模型组</h2>
            <p class="text-xs text-ink-500 mt-1" data-i18n="modelGroups.desc">组名可直接当作模型名称在客户端请求中使用，组内按顺序 fallback 切换。</p>
        </div>
        <button type="button" onclick="openModelGroupModal()" class="btn-primary text-sm px-4 py-2 font-medium whitespace-nowrap flex items-center gap-1.5" aria-label="添加模型组">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
            <span data-i18n="modelGroups.addBtn">添加模型组</span>
        </button>
    </div>
    <div id="modelGroupList" class="space-y-3 animate-fade-in">
        <div class="loading-text flex items-center justify-center gap-2">
            <span class="spinner"></span>
            <span data-i18n="common.loading">加载中...</span>
        </div>
    </div>
</div>
