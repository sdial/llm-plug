<!-- 统计 Tab -->
<div id="statsTab">
    <div class="flex items-center gap-2 sm:gap-3 mb-5 flex-wrap">
        <h2 class="text-sm font-semibold text-ink-900" data-i18n="stats.rangeLabel">统计范围</h2>
        <select id="statsDays" onchange="loadStats()" class="text-xs border border-surface-200 rounded-lg px-2.5 py-1.5 outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 bg-white">
            <option value="today" selected data-i18n="stats.rangeToday">今天</option>
            <option value="this_week" data-i18n="stats.rangeThisWeek">本周</option>
            <option value="this_month" data-i18n="stats.rangeThisMonth">本月</option>
            <option value="7" data-i18n="stats.range7d">最近7天</option>
            <option value="30" data-i18n="stats.range30d">最近30天</option>
            <option value="90" data-i18n="stats.range90d">最近90天</option>
            <option value="365" data-i18n="stats.range365d">最近1年</option>
            <option value="0" data-i18n="stats.rangeAll">全部</option>
        </select>
        <div class="hidden sm:block flex-1"></div>
        <span id="statsCutoffTime" class="text-xs text-ink-400 hidden"><span data-i18n="stats.cutoffPrefix">数据截止:</span> <span id="cutoffTimeValue">-</span></span>
        <button type="button" id="refreshStatsBtn" onclick="refreshStatsData()" class="pill pill-muted hover:bg-surface-200 transition cursor-pointer text-xs flex items-center gap-1.5 ml-auto sm:ml-0" data-i18n-aria="stats.refreshBtn">
            <svg id="refreshStatsIcon" class="w-3 h-3" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-6.219-8.56"/><polyline points="21 3 21 9 15 9"/></svg>
            <span id="refreshStatsText" data-i18n="stats.refreshBtn">刷新数据</span>
        </button>
    </div>

    <!-- Metrics Grid -->
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-7 gap-3 mb-6">
        <div class="card p-4">
            <div class="text-xs text-ink-500 uppercase tracking-wider font-medium mb-1" data-i18n="stats.cardTotal">总请求</div>
            <div id="stat_total" class="text-2xl font-bold text-ink-900">-</div>
        </div>
        <div class="card p-4">
            <div class="text-xs text-ink-500 uppercase tracking-wider font-medium mb-1" data-i18n="stats.cardSuccessRate">成功率</div>
            <div id="stat_success_rate" class="text-2xl font-bold text-emerald-600">-</div>
        </div>
        <div class="card p-4">
            <div class="text-xs text-ink-500 uppercase tracking-wider font-medium mb-1" data-i18n="stats.cardAvgLatency">平均延迟</div>
            <div id="stat_avg_latency" class="text-2xl font-bold text-amber-600">-</div>
        </div>
        <div class="card p-4">
            <div class="text-xs text-ink-500 uppercase tracking-wider font-medium mb-1" data-i18n="stats.cardInputTokens">输入 Token</div>
            <div id="stat_input_tokens" class="text-2xl font-bold text-cyan-600">-</div>
        </div>
        <div class="card p-4">
            <div class="flex items-center justify-between text-xs text-ink-500 uppercase tracking-wider font-medium mb-1">
                <span data-i18n="stats.cardCacheHit">缓存命中</span>
                <span id="stat_cache_hit_rate" class="font-medium text-emerald-600">-</span>
            </div>
            <div id="stat_cache_hit" class="text-2xl font-bold text-emerald-600">-</div>
        </div>
        <div class="card p-4">
            <div class="text-xs text-ink-500 uppercase tracking-wider font-medium mb-1" data-i18n="stats.cardOutputTokens">输出 Token</div>
            <div id="stat_output_tokens" class="text-2xl font-bold text-violet-600">-</div>
        </div>
        <div class="card p-4">
            <div class="text-xs text-ink-500 uppercase tracking-wider font-medium mb-1" data-i18n="stats.cardTotalTokens">总 Token</div>
            <div id="stat_total_tokens" class="text-2xl font-bold text-ink-900">-</div>
        </div>
    </div>

    <!-- Distribution Charts -->
    <div class="grid md:grid-cols-3 gap-4 mb-6">
        <div class="card p-4">
            <h3 class="text-xs font-semibold text-ink-600 uppercase tracking-wider mb-3" data-i18n="stats.distChannelReq">渠道请求分布</h3>
            <div id="channel_dist" class="space-y-2">-</div>
        </div>
        <div class="card p-4">
            <h3 class="text-xs font-semibold text-ink-600 uppercase tracking-wider mb-3" data-i18n="stats.distModelReq">模型请求分布</h3>
            <div id="model_dist" class="space-y-2">-</div>
        </div>
        <div class="card p-4">
            <h3 class="text-xs font-semibold text-ink-600 uppercase tracking-wider mb-3" data-i18n="stats.distApikeyReq">API Key 请求分布</h3>
            <div id="apikey_dist" class="space-y-2">-</div>
        </div>
    </div>

    <div class="grid md:grid-cols-3 gap-4 mb-6">
        <div class="card p-4">
            <h3 class="text-xs font-semibold text-ink-600 uppercase tracking-wider mb-3" data-i18n="stats.distChannelToken">渠道 Token 分布</h3>
            <div id="channel_token_dist" class="space-y-2">-</div>
        </div>
        <div class="card p-4">
            <h3 class="text-xs font-semibold text-ink-600 uppercase tracking-wider mb-3" data-i18n="stats.distModelToken">模型 Token 分布</h3>
            <div id="model_token_dist" class="space-y-2">-</div>
        </div>
        <div class="card p-4">
            <h3 class="text-xs font-semibold text-ink-600 uppercase tracking-wider mb-3" data-i18n="stats.distApikeyToken">API Key Token 分布</h3>
            <div id="apikey_token_dist" class="space-y-2">-</div>
        </div>
    </div>

    <!-- Daily Trend -->
    <div class="card p-4">
        <div class="flex items-center justify-between mb-4">
            <h3 id="trendTitle" class="text-xs font-semibold text-ink-600 uppercase tracking-wider"></h3>
            <div class="flex items-center gap-2">
                <span id="refreshHint" class="text-xs text-emerald-600 opacity-0 transition-opacity duration-300"></span>
                <button type="button" id="refreshDailyBtn" onclick="refreshStats()" class="pill pill-brand hover:opacity-80 transition cursor-pointer text-xs" data-i18n="stats.refreshStatsBtn">刷新统计</button>
            </div>
        </div>
        <div id="daily_trend" class="overflow-x-auto">
            <table class="w-full text-sm responsive-card">
                <thead>
                    <tr>
                        <th id="trendTimeHeader" class="text-left py-2.5 px-2 text-xs text-ink-600 font-semibold uppercase tracking-wider" data-i18n="stats.colDate">日期</th>
                        <th class="text-right py-2.5 px-2 text-xs text-ink-600 font-semibold uppercase tracking-wider" data-i18n="stats.colRequests">请求数</th>
                        <th class="text-right py-2.5 px-2 text-xs text-ink-600 font-semibold uppercase tracking-wider" data-i18n="stats.colSuccess">成功</th>
                        <th class="text-right py-2.5 px-2 text-xs text-ink-600 font-semibold uppercase tracking-wider" data-i18n="stats.colFail">失败</th>
                        <th class="text-right py-2.5 px-2 text-xs text-ink-600 font-semibold uppercase tracking-wider" data-i18n="stats.colAvgLatency">平均延迟</th>
                        <th class="text-right py-2.5 px-2 text-xs text-ink-600 font-semibold uppercase tracking-wider" data-i18n="stats.colInputToken">输入Token</th>
                        <th class="text-right py-2.5 px-2 text-xs text-ink-600 font-semibold uppercase tracking-wider" data-i18n="stats.colCacheHit">缓存命中</th>
                        <th class="text-right py-2.5 px-2 text-xs text-ink-600 font-semibold uppercase tracking-wider" data-i18n="stats.colOutputToken">输出Token</th>
                    </tr>
                </thead>
                <tbody id="daily_tbody"></tbody>
            </table>
        </div>
    </div>
</div>
